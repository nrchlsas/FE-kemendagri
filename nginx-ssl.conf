# Define SSL certificates
ssl_certificate /etc/nginx/ssl/sipdhub_kemendagri_go_id.crt;   # Path to your SSL certificate
ssl_certificate_key /etc/nginx/ssl/sipdhub_kemendagri_go_id.key;   # Path to your SSL private key


upstream api-gateway {
    server 192.168.112.31:9007;
}

upstream rbac {
    server 192.168.112.31:9005;
}

upstream user {
    server 192.168.112.31:9011;
}

upstream core {
    server 192.168.112.31:20000;
}

# HTTP to HTTPS redirection (optional but recommended)
server {
    listen 80;
    server_name sipdhub.kemendagri.go.id;  # Replace with your domain name

    # Redirect all HTTP requests to HTTPS
    return 301 https://$host$request_uri;
}

# HTTPS server block
server {
    listen 443 ssl;

    server_name sipdhub.kemendagri.go.id;  # Replace with your domain name

    # SSL configuration
    ssl_certificate /etc/nginx/ssl/sipdhub_kemendagri_go_id.crt;  # Path to your SSL certificate
    ssl_certificate_key /etc/nginx/ssl/sipdhub_kemendagri_go_id.key;  # Path to your SSL private key

    # Enable SSL protocols and ciphers for security
    ssl_protocols TLSv1.2 TLSv1.3;  # Prefer newer, secure TLS versions
    ssl_ciphers 'TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';  # Strong ciphers
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;

    # Serve frontend static files
    location / {
        root /usr/share/nginx/html;  # Default location for frontend build files in NGINX
        try_files $uri /index.html;

        # CORS headers
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS';
        add_header Access-Control-Allow-Headers 'Authorization, DNT, X-CustomHeader, Keep-Alive, User-Agent, X-Requested-With, If-Modified-Since, Cache-Control, Content-Type, x-sipdhub';
        add_header Access-Control-Allow-Credentials true;

        # Handle OPTIONS preflight requests
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS';
            add_header Access-Control-Allow-Headers 'Authorization, DNT, X-CustomHeader, Keep-Alive, User-Agent, X-Requested-With, If-Modified-Since, Cache-Control, Content-Type, x-sipdhub';
            add_header Access-Control-Allow-Credentials true;
            add_header Content-Type 'text/plain charset=UTF-8';
            add_header Content-Length 0;
            return 204;
        }
    }

    # API Gateway proxy (handle CORS)
    location /api/ {
        proxy_pass http://api-gateway/;  # Docker service name used as the hostname
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS headers
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS';
        add_header Access-Control-Allow-Headers 'Authorization, DNT, X-CustomHeader, Keep-Alive, User-Agent, X-Requested-With, If-Modified-Since, Cache-Control, Content-Type, x-sipdhub';
        add_header Access-Control-Allow-Credentials true;

        # Handle OPTIONS preflight requests
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS';
            add_header Access-Control-Allow-Headers 'Authorization, DNT, X-CustomHeader, Keep-Alive, User-Agent, X-Requested-With, If-Modified-Since, Cache-Control, Content-Type, x-sipdhub';
            add_header Access-Control-Allow-Credentials true;
            add_header Content-Type 'text/plain charset=UTF-8';
            add_header Content-Length 0;
            return 204;
        }
    }

    # Proxy other backend services similarly
    location /rbac/ {
        proxy_pass http://rbac/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /user/ {
        proxy_pass http://user/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /core/ {
        proxy_pass http://core/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

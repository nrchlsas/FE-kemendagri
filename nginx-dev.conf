    server {
        listen 80;
        server_name sipd-hub.kemendagri.go.id;

        # Global CORS settings for all services (optional)
        # add_header 'Access-Control-Allow-Origin' '*';
        # add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
        # add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization';
        # add_header 'Access-Control-Allow-Credentials' 'true';
        # add_header 'Access-Control-Max-Age' 3600;

        # Handle OPTIONS preflight requests for CORS
        # if ($request_method = 'OPTIONS') {
        #     add_header 'Access-Control-Allow-Origin' '*';
        #     add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
        #     add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization';
        #     add_header 'Access-Control-Allow-Credentials' 'true';
        #     add_header 'Access-Control-Max-Age' 3600;
        #     return 204;  # No content response for OPTIONS
        # }

        # Serve the Frontend application
        location / {
            proxy_pass http://fe-sipdhub:3000; # Redirect frontend traffic to the frontend container
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # CORS headers for frontend
            # add_header 'Access-Control-Allow-Origin' '*';
            # add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
            # add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization';
            # add_header 'Access-Control-Allow-Credentials' 'true';
            # add_header 'Access-Control-Max-Age' 3600;

            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization';
                add_header 'Access-Control-Allow-Credentials' 'true';
                add_header 'Access-Control-Max-Age' 3600;
                return 204;  # No content response for OPTIONS
            }
        }

        # Reverse proxy for API Gateway
        location /api/ {
            rewrite ^/api(/.*)$ $1 break;  # Strip /api prefix
            proxy_pass http://api-gateway:9007; # Forward API Gateway traffic
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Optional: Set CORS headers for frontend communication (if needed)
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Max-Age' 3600 always;

            # Handle preflight CORS requests
            if ($request_method = 'OPTIONS') {
                return 204;  # No content response for OPTIONS (CORS preflight)
            }
        }

        # Reverse proxy for RBAC service
        location /rbac/ {
            proxy_pass http://rbac-sipdhub:9005; # Forward RBAC traffic
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # CORS headers for RBAC
            # add_header 'Access-Control-Allow-Origin' '*';
            # add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
            # add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization';
            # add_header 'Access-Control-Allow-Credentials' 'true';
            # add_header 'Access-Control-Max-Age' 3600;

            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization';
                add_header 'Access-Control-Allow-Credentials' 'true';
                add_header 'Access-Control-Max-Age' 3600;
                return 204;  # No content response for OPTIONS
            }
        }

        # Reverse proxy for User service
        location /user/ {
            proxy_pass http://user-sipdhub:9011; # Forward User service traffic
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # CORS headers for User service
            # add_header 'Access-Control-Allow-Origin' '*';
            # add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
            # add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization';
            # add_header 'Access-Control-Allow-Credentials' 'true';
            # add_header 'Access-Control-Max-Age' 3600;

            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization';
                add_header 'Access-Control-Allow-Credentials' 'true';
                add_header 'Access-Control-Max-Age' 3600;
                return 204;  # No content response for OPTIONS
            }
        }

        # Reverse proxy for Core service
        location /core/ {
            proxy_pass http://core:20000; # Forward Core service traffic
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # CORS headers for Core service
            # add_header 'Access-Control-Allow-Origin' '*';
            # add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
            # add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization';
            # add_header 'Access-Control-Allow-Credentials' 'true';
            # add_header 'Access-Control-Max-Age' 3600;

            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization';
                add_header 'Access-Control-Allow-Credentials' 'true';
                add_header 'Access-Control-Max-Age' 3600;
                return 204;  # No content response for OPTIONS
            }
        }
    }

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
}
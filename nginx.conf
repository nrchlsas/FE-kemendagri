server {
  listen 80;

  location / {
    root /usr/share/nginx/html/;
    include /etc/nginx/mime.types;
    try_files $uri $uri/ /index.html;
  }
}


events {
  worker_connections 1024; # Specifies the maximum number of simultaneous connections per worker
}

http {
  upstream user {
    server user-pendapatan-service:9011;
  }

  server { 
    listen 9011;

    location / {
      proxy_pass http://user/;
      rewrite ^/sipd(/.*)$ $1 break;
      root /usr/share/nginx/html/;
      include /etc/nginx/mime.types;
      try_files $uri $uri/ /index.html;
      proxy_set_header Accept-Encoding "x-sipdhub";
      proxy_redirect off;
      proxy_set_header Host $host:$server_port;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Optional: Handle static assets for frontend if needed
    # location /static/ {
    #  root /app;
    #}
  }
}

